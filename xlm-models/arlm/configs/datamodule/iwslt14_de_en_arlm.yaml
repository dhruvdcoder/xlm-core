# @package _global_
defaults:
  - default
  - /datasets@datamodule.dataset_managers.train.lm: iwslt14_de_en_rdm_train
  - /datasets@datamodule.dataset_managers.val.lm: iwslt14_de_en_rdm_val
  - /datasets@datamodule.dataset_managers.val.prediction: iwslt14_de_en_rdm_val_pred
  - /datasets@datamodule.dataset_managers.test.lm: iwslt14_de_en_rdm_test
  - /datasets@datamodule.dataset_managers.test.prediction: iwslt14_de_en_rdm_test_pred
  - /datasets@datamodule.dataset_managers.predict.prediction: iwslt14_de_en_rdm_test_pred
  - /collator@datamodule.dataset_managers.train.lm.collator: seq2seq_arlm
  - /collator@datamodule.dataset_managers.val.lm.collator: seq2seq_arlm
  - /collator@datamodule.dataset_managers.test.lm.collator: seq2seq_arlm
  - /collator@datamodule.dataset_managers.val.prediction.collator: seq2seq_pred_arlm
  - /collator@datamodule.dataset_managers.test.prediction.collator: seq2seq_pred_arlm
  - /collator@datamodule.dataset_managers.predict.prediction.collator: seq2seq_pred_arlm
  - /tokenizer@global_components.tokenizer: iwslt14_joint_char_bpe_v1

block_size: 128
input_block_size: 128

datamodule:
  print_batch_fn: arlm.datamodule_arlm.print_batch_arlm
  # Keep seq2seq_arlm / seq2seq_pred_arlm default add_bos: output
  # (source + <bos> + target). Unlike MLM/FlexMDM IWSLT.

tags:
  dataset: iwslt14_de_en_rdm_v1
