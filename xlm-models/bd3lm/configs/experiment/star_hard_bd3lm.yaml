# @package _global_
defaults:
  - override /datamodule: star_hard_bd3lm
  - override /noise_schedule: bd3lm # default
  - override /model_type: bd3lm
  - override /model: bd3lm

per_device_batch_size: 64
global_batch_size: 64
per_device_val_batch_size: 64
prompt_size: 116
block_size: 4
target_size: 24
datamodule:
  print_batch_fn: bd3lm.datamodule_bd3lm.print_batch_bd3lm
  dataset_managers:
    val:
      prediction:
        dataloader_kwargs:
          batch_size: 1
    test:
      prediction:
        dataloader_kwargs:
          batch_size: 1
monitored_metric: val/lm/accumulated_loss

model:
  config:
    model:
      dropout: 0.2

global_components:
  tokenizer:
    _target_: xlm.datamodule.SimpleSpaceTokenizer.for_numbers
    vocab_size: 56 # 20 (easy,medium), 56 (hard)

loggers:
  tensorboard:
    _target_: lightning.pytorch.loggers.tensorboard.TensorBoardLogger
    save_dir: ${paths.output_dir}/tensorboard
    name: null
    version: null
    log_graph: false
    default_hp_metric: true
    prefix: ""


trainer:
  max_steps: 80000 
  val_check_interval: 2000
  num_sanity_val_steps: 3
  check_val_every_n_epoch: null

log_predictions:
  _target_: xlm.log_predictions.LogPredictions
  fields_to_keep_in_output:
    - input_text
    - text
    - truth
  inject_target: target_ids
  writers:
    - file
    - logger

callbacks:
    checkpoint_monitor:
      monitor: val/lm/accumulated_loss

optimizer:
  lr: 0.0001
  weight_decay: 0.1

lr_scheduler:
  name: "constant" # https://github.com/huggingface/transformers/blob/main/src/transformers/trainer_utils.py#L435
  num_warmup_steps: 500
  num_training_steps: ${trainer.max_steps}
  monitor: "train/loss"

predictor:
  sampling_method: sample_top_k
  top: 1
