# @package _global_
defaults:
  - /metrics@reported_metrics.train.lm.accumulated_loss: accumulated_loss
  - /metrics@reported_metrics.val.lm.accumulated_loss: accumulated_loss
  - /metrics@reported_metrics.test.lm.accumulated_loss: accumulated_loss
  - /metrics@reported_metrics.val.lm.perplexity: perplexity_bd3lm
  - /metrics@reported_metrics.test.lm.perplexity: perplexity_bd3lm


loss_on_padding: false

lightning_module:
  _target_: xlm.harness.Harness

loss:
  _target_: bd3lm.loss_bd3lm.Bd3lmLoss
  loss_on_padding: ${loss_on_padding}

predictor:
  _target_: bd3lm.predictor_bd3lm.Bd3lmUnconditionalPredictor
  tokenizer: ${lightning_module:tokenizer}
  noise_schedule: ${lightning_module:noise_schedule}
  max_steps: ${block_size}
  max_length: ${eval:${block_size}+${oc.select:input_block_size,0}}
  sampling_method: sample_top_p
  p: 0.5

diagnostic_metrics: null

reported_metrics:
  train:
    lm:
      accumulated_loss:
        prefix: train/lm
        update_fn: bd3lm.metrics_bd3lm.mean_metric_update_fn
  val:
    lm:
      accumulated_loss:
        prefix: val/lm
        update_fn: bd3lm.metrics_bd3lm.mean_metric_update_fn
      perplexity:
        prefix: val/lm
        update_fn: bd3lm.metrics_bd3lm.perplexity_metric_update_fn
  test:
    lm:
      accumulated_loss:
        prefix: test/lm
        update_fn: bd3lm.metrics_bd3lm.mean_metric_update_fn
      perplexity:
        prefix: test/lm
        update_fn: bd3lm.metrics_bd3lm.perplexity_metric_update_fn

tags:
  model_type: bd3lm_unconditional
