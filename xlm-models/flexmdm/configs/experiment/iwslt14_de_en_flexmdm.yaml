# @package _global_
defaults:
  - text_flexmdm
  - /post_hoc_evaluator@post_hoc_evaluator.evaluators.prediction.mt: iwslt14_mt
  - override /datamodule: iwslt14_de_en_flexmdm
  - override /noise_schedule: flexmdm_linear
  - override /model_type: flexmdm_iwslt_seq2seq
  - override /model: ddit_flexmdm_xtiny

per_device_batch_size: 32
global_batch_size: 512
num_dataloader_workers: 5
block_size: 128
input_block_size: 128
len_predict_type: expectation
monitored_metric: val/lm/accumulated_loss

model:
  force_flash_attn: false
  len_head_type: mlp
  compile: false

trainer:
  max_steps: 1000_000
  val_check_interval: 50000
  check_val_every_n_epoch: null
  num_sanity_val_steps: 3

optimizer:
  lr: 0.0001

lr_scheduler:
  name: constant_with_warmup
  num_warmup_steps: 2000
  num_training_steps: ${trainer.max_steps}
  monitor: train/loss

callbacks:
  checkpoint_every_n_steps:
    every_n_train_steps: 2500
    keep_multiple: 40

datamodule:
  print_batch_fn: flexmdm.datamodule_flexmdm.print_batch_flexmdm

predictor:
  confidence: null
  top_k: null
  top_p: null
  max_steps: ${block_size}
  max_new_tokens: ${block_size}

log_predictions:
  _target_: xlm.log_predictions.LogPredictions
  fields_to_keep_in_output:
    - text
    - generated_text
    - truth
    - target_text
    - target_raw
    - id
  inject_target: target_ids
  additional_fields_from_batch:
    - target_text
    - target_raw
    - id
  writers:
    - file
    - logger

tags:
  dataset: iwslt14_de_en_rdm_v1
