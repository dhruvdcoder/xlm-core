# @package _global_
# FlexMDM (Dream-Coder) reference schedules: alpha(t) = 1 - (1 - t)^n.
# Released checkpoint: schedule_a = schedule_b = 1.7, i.e. insertion exponent a = 1.7
# and unmasking exponent a * b = 2.89 (genuine-any-order/FlexMDM/flexmdm/config/fsdp_train.yaml).
insertion_exponent: 1.7
unmasking_exponent: 2.89

global_components:
  noise_schedule:
    _target_: flexmdm.noise_flexmdm.FlexMDMNoiseSchedule
    insertion_noise_schedule:
      _target_: flexmdm.noise_flexmdm.PowerSchedule
      exp: ${insertion_exponent}
    unmasking_noise_schedule:
      _target_: flexmdm.noise_flexmdm.PowerSchedule
      exp: ${unmasking_exponent}

tags:
  noise_schedule: power
