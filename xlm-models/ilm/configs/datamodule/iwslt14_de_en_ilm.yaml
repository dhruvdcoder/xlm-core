# @package _global_
defaults:
  - default
  - /datasets@datamodule.dataset_managers.train.lm: iwslt14_de_en_rdm_train
  - /datasets@datamodule.dataset_managers.val.lm: iwslt14_de_en_rdm_val
  - /datasets@datamodule.dataset_managers.val.prediction: iwslt14_de_en_rdm_val_pred
  - /datasets@datamodule.dataset_managers.test.lm: iwslt14_de_en_rdm_test
