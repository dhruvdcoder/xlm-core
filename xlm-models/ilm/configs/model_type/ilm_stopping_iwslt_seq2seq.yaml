# @package _global_
# Seq2seq ILM (stopping) without token-level prediction metrics (use post-hoc SacreBLEU / chrF++).
defaults:
  - /metrics@reported_metrics.train.lm.accumulated_loss: accumulated_loss
  - /metrics@reported_metrics.val.lm.accumulated_loss: accumulated_loss
  - /metrics@reported_metrics.test.lm.accumulated_loss: accumulated_loss
  - /metrics@diagnostic_metrics.train.lm.length_loss: seq2seq_length_loss
  - /metrics@diagnostic_metrics.val.lm.length_loss: seq2seq_length_loss
  - /metrics@diagnostic_metrics.train.lm.token_ce: seq2seq_token_ce
  - /metrics@diagnostic_metrics.val.lm.token_ce: seq2seq_token_ce

lightning_module:
  _target_: xlm.harness.Harness

loss:
  _target_: ilm.loss_ilm.ILMLossWithMaskedCE
  length_loss: binary_ce

predictor:
  _target_: ilm.predictor_ilm.ILMPredictorWithStoppingClassification
  tokenizer: ${lightning_module:tokenizer}
  noise_schedule: ${lightning_module:noise_schedule}
  max_steps: ${block_size}
  max_length: ${eval:${block_size}+${oc.select:input_block_size,0}}
  sampling_method: sample_top_p
  p: 0.5
  second_sampling_method: sample_top_k
  second_top: 2

diagnostic_metrics:
  train:
    lm:
      length_loss:
        prefix: train/lm
        update_fn: ilm.metrics_ilm.length_loss_metric_update_fn
      token_ce:
        prefix: train/lm
        update_fn: ilm.metrics_ilm.token_ce_metric_update_fn
  val:
    lm:
      length_loss:
        prefix: val/lm
        update_fn: ilm.metrics_ilm.length_loss_metric_update_fn
      token_ce:
        prefix: val/lm
        update_fn: ilm.metrics_ilm.token_ce_metric_update_fn

reported_metrics:
  train:
    lm:
      accumulated_loss:
        prefix: train/lm
        update_fn: ilm.metrics_ilm.mean_metric_update_fn
  val:
    lm:
      accumulated_loss:
        prefix: val/lm
        update_fn: ilm.metrics_ilm.mean_metric_update_fn
  test:
    lm:
      accumulated_loss:
        prefix: test/lm
        update_fn: ilm.metrics_ilm.mean_metric_update_fn

tags:
  model_type: ilm_stopping_iwslt_seq2seq
