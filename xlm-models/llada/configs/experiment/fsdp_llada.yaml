# @package _global_
# Overlay: compose as experiment=[openmath_llada_sft,fsdp_llada] (or
# opencode_openmath_llada_sft) with trainer_strategy=fsdp.
lightning_module:
  _target_: llada.harness_llada.FSDPHarness

trainer:
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  strategy:
    # Needed so RELAY forward hooks on wte / blocks see real parameters under FSDP.
    use_orig_params: true
    auto_wrap_policy:
      _target_: xlm.utils.fsdp_grouping.make_layer_wrap_policy
      _args_:
        - xlm.backbones.llada.modeling_llada.LLaDALlamaBlock
    activation_checkpointing_policy:
      _target_: xlm.utils.fsdp_grouping.make_layer_wrap_policy
      _args_:
        - xlm.backbones.llada.modeling_llada.LLaDALlamaBlock
    mixed_precision:
      _target_: xlm.utils.fsdp_grouping.fsdp_bf16_mixed_precision
